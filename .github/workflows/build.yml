      - name: Build
        id: build
        working-directory: project
        run: ./gradlew build --stacktrace

      - name: Show jars
        working-directory: project
        run: ls -la build/libs

      - uses: actions/upload-artifact@v7
        with:
          name: sessionwrapped-jar
          path: project/build/libs/*.jar
          if-no-files-found: error

      # Save the cache even when the build fails (e.g. a code error), but only if Forge's setup finished.
      - name: Stop Gradle
        if: always()
        working-directory: project
        run: ./gradlew --stop || true

      - name: Did Forge setup finish?
        id: forge
        if: always()
        run: |
          if find project/.gradle/mavenizer/repo -name 'forge-26.2-65.1.1*.jar' 2>/dev/null | grep -q .; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Minecraft/Forge cache
        if: always() && steps.forge.outputs.ready == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches
            project/.gradle/mavenizer
          key: forge-26.2-65.1.1-v1

# Session Wrapped + Worth Scanner v1.1.0 - the WHOLE project in this one file.
# Paste it into GitHub as .github/workflows/build.yml. On commit it unpacks the source, builds the jar
# against Forge 26.2, and attaches it to the run as the "sessionwrapped-jar" artifact.

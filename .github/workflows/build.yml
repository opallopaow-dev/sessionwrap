# Session Wrapped + Worth Scanner v1.2.0 - the WHOLE project in this one file.
# Paste it into GitHub as .github/workflows/build.yml. On commit it unpacks the source, builds the jar
# against Forge 26.2, and attaches it to the run as the "sessionwrapped-jar" artifact.
name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      # Minecraft/Forge setup takes ~5 minutes the first time; this reuses it on later runs.
      # If a build ever acts strangely after a cache restore, change "v1" to "v2" in both keys below.
      - name: Restore Minecraft/Forge cache
        id: cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches
            project/.gradle/mavenizer
          key: forge-26.2-65.1.1-v1

      - name: Unpack the project
        run: |
          mkdir -p project
          cd project
          base64 -d <<'PROJECT_B64' | tar xz
